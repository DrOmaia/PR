name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk residency-counter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: residency-counter
          path: |
            residency-counter.apk
            app/build/screens/*.png
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" residency-counter.apk
          --title "Residency Counter (build ${{ github.run_number }})"
          --notes "Download residency-counter.apk on the phone and open it to install."
          --target "${{ github.sha }}"
