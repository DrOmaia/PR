plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dromaia.residency'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dromaia.residency'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // One fixed key (private repository, personal app) so every build installs over the previous one
    // and the saved dates are kept.
    signingConfigs {
        app {
            storeFile file('app.keystore')
            storePassword 'residency'
            keyAlias 'app'
            keyPassword 'residency'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
